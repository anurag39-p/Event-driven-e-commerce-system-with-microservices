services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./services/user-service
    container_name: user-service
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=4001
    # No host port published: only reachable via the Gateway or the
    # internal Docker network (e.g. `docker-compose exec user-service ...`).
    expose:
      - "4001"
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build: ./services/product-service
    container_name: product-service
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=4002
    expose:
      - "4002"

  order-service:
    build: ./services/order-service
    container_name: order-service
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=4003
    expose:
      - "4003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=4004
    expose:
      - "4004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=4005
    expose:
      - "4005"
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://localhost:4000/api
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
      - "4173:4173"
    depends_on:
      - api-gateway

volumes:
  postgres_data: